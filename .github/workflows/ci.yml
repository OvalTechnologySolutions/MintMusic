name: CI

on:
  push:
    branches: [main, quickdeploy]
  pull_request:
    branches: [main, quickdeploy]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mintmusic
          POSTGRES_PASSWORD: mintmusic
          POSTGRES_DB: mintmusic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mintmusic:mintmusic@localhost:5432/mintmusic_test
      DATABASE_URL_UNPOOLED: postgresql://mintmusic:mintmusic@localhost:5432/mintmusic_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @mintmusic/api

      - name: Push database schema
        run: npm run db:push -w @mintmusic/api

      - name: Lint web
        run: npm run lint:web

      - name: Run tests
        run: npm test

      - name: Build shared
        run: npm run build -w @mintmusic/shared --if-present || true

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
        env:
          AUTH_SECRET: ci-test-secret-minimum-32-characters-long
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
